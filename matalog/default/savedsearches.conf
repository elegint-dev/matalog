# One saved search per catalog job: look up a field, browse a source, find waste, field history, cost per run.
# Tokens are passed by the caller: | savedsearch "matalog job 1 look up a field" field_name="user"

[matalog job 1 look up a field]
description = Every sourcetype that carries a field, with coverage, cardinality, freshness, sample values and origin. Token: field_name.
search = | inputlookup matalog_fields where field_name="$field_name$" level="source"
disabled = 0
enableSched = 0

[matalog job 1 drill to strata]
description = The same field per stratum of each sourcetype. Token: field_name.
search = | inputlookup matalog_fields where field_name="$field_name$" level="stratum"
disabled = 0
enableSched = 0

[matalog job 1 full usage list]
description = Knowledge objects that reference a field name. Token: field_name.
search = | inputlookup matalog_usage where field_name="$field_name$"
disabled = 0
enableSched = 0

[matalog job 2 browse a source]
description = The field list of one source, grouped by stratum. Token: source_key.
search = | inputlookup matalog_fields where source_key="$source_key$" | sort 0 stratum_value, field_name
disabled = 0
enableSched = 0

[matalog job 2 source header]
description = Volume, freshness, last human search and stratum key of one source. Token: source_key.
search = | inputlookup matalog_sources where source_key="$source_key$"
disabled = 0
enableSched = 0

[matalog job 5 find waste]
description = Sources nobody has searched for 30 days or more, by licensed daily volume. The waste view runs the same rows with the threshold as an input.
search = | inputlookup matalog_sources | eval days_idle=round((now()-coalesce(last_human_search_time,0))/86400) | where days_idle >= 30 | sort 0 - daily_bytes | table src_index src_sourcetype daily_bytes daily_bytes_status daily_events last_human_search_time last_human_search_user days_idle usage_count usage_alert_count
disabled = 0
enableSched = 0

[matalog cost per run]
description = The profiler's cost per run against its budget.
search = | inputlookup matalog_runs | table run_id searches_issued events_scanned search_seconds wall_seconds budget_exhausted
disabled = 0
enableSched = 0

[matalog drift chart]
description = A field's history from the summary index: coverage, cardinality and stratum events per committed run. The rows of every stratum of the source are summed, so a level=source row of a stratified source reads as its rollup. Tokens: source_key, field_name, mode (discovery or profile).
search = search index=matalog_profiles kind=field mode="$mode$" source_key="$source_key$" field_name="$field_name$" [search index=matalog_profiles kind=commit | stats max(attempt) as attempt by run_id | fields run_id attempt] | dedup run_id attempt profile_id | stats sum(count) as count sum(events_in_stratum) as events max(distinct) as distinct by _time run_id | eval coverage=round(count/events, 4) | timechart span=1h cont=false max(coverage) as coverage max(distinct) as distinct max(events) as events
dispatch.earliest_time = 0
disabled = 0
enableSched = 0

[matalog drift chart by field_key]
description = The history of one measured field row (a stratum row, or the level=source row of an unstratified source), per committed run. Tokens: field_key, mode (discovery or profile).
search = search index=matalog_profiles kind=field mode="$mode$" field_key="$field_key$" [search index=matalog_profiles kind=commit | stats max(attempt) as attempt by run_id | fields run_id attempt] | timechart span=1h cont=false max(coverage) as coverage max(distinct) as distinct max(events_in_stratum) as events
dispatch.earliest_time = 0
disabled = 0
enableSched = 0

# The agent surface by search: the same compact columns as /services/matalog/summary, one row per field or source.
# Tokens: source (a source_key or <index>:<sourcetype>), field_name, type, q. Splunk default fields are listed with dflt=1 (a token
# cannot be optional); the endpoint hides them unless defaults=1. Every row carries kind (field, source) and the
# window its counts cover (ws, we, a discovery row's from its stratum row; src_ws, src_we for the source's day),
# no_events (1 when ev is 0) and anchor (last_event on an anchored first discovery); an empty answer is one kind=window row
# with the windows of the newest committed run (macros.conf).

[matalog agent source summary]
description = Agent surface. Every source-level field of one source with the source essentials as src_* columns; the same keys as the summary endpoint. Token: source, a source_key or index:sourcetype.
search = | inputlookup matalog_fields where level="source" presence="present" [| inputlookup matalog_sources | eval source=src_index.":".src_sourcetype | where source_key="$source$" OR source="$source$" | fields source_key | append [| makeresults | eval source_key="__none__" | fields source_key] | format] \
| lookup matalog_sources source_key OUTPUT state AS src_state daily_events AS src_events_day daily_bytes AS src_bytes_day first_event_time AS src_first_event last_event_time AS src_last_event last_human_search_time AS src_last_search last_human_search_user AS src_last_search_user stratum_field AS src_stratum_field strata_count AS src_strata_n field_count AS src_fields usage_count AS src_used usage_alert_count AS src_alerts config_apps AS src_apps profile_mode AS src_mode sample_ratio AS src_ratio updated_run_id AS src_updated \
| `matalog_source_window` \
| join type=left source_key [| inputlookup matalog_strata where level="stratum" state="active" | eval s=stratum_value."=".round(share_of_source,3) | stats values(s) AS src_strata by source_key | eval src_strata=mvjoin(src_strata,";")] \
| makemv delim=";" src_strata \
| eval src_strata_n=if(src_stratum_field="__all__",0,src_strata_n) \
| eval win=if(isnotnull(cur_prof_run_id),"profile","discovery"), cov=if(win="profile",cur_prof_coverage,cur_disc_coverage), cnt=if(win="profile",cur_prof_count,cur_disc_count), ev=if(win="profile",cur_prof_events,cur_disc_events), dist=if(win="profile",cur_prof_distinct,cur_disc_distinct), exact=if(win="profile",cur_prof_distinct_exact,null()), ratio=if(win="profile",coalesce(cur_prof_sample_ratio,1),1), run=if(win="profile",cur_prof_run_id,cur_disc_run_id) \
| `matalog_row_window` \
| eval top=mvzip(mvindex(top_counts,0,9), mvindex(top_values,0,9), " "), samples=if(isnull(top),mvindex(sample_values,0,4),null()), objects=mvindex(usage_objects,0,4), num=if(numeric_count>0,num_min.",".num_max.",".num_mean,null()) \
| eval fname=if(match(field_name,"[^A-Za-z0-9_.:]"),"\"".field_name."\"",field_name), spl="index=".src_index." sourcetype=\"".src_sourcetype."\" ".fname."=* | stats count by ".fname \
| rename field_name AS n, src_index AS idx, src_sourcetype AS st, field_key AS key, type_guess AS tg, identifier AS id, best_type_rate AS tr, last_seen_time AS seen, first_seen_run AS first_run, origin AS org, origin_app AS app, origin_stanza AS stanza, origin_conflict AS conflict, cim_fields AS dm, meaning_human AS mean, meaning_human_author AS mean_by, meaning_human_time AS mean_at, usage_count AS used, usage_alert_count AS alerts, usage_unscoped_count AS unscoped, rollup_strata AS strata_n, absent_strata AS abs, absent_strata_count AS absn, is_default AS dflt \
| eval ty=replace(best_type_id, "^(mt|user):", ""), kind="field" \
| fillnull value=0 used alerts unscoped conflict id strata_n absn dflt \
| table kind n idx st key cov cnt ev dist exact win ratio run ws we no_events anchor tg id ty tr seen first_run org app stanza conflict dm mean mean_by mean_at used alerts unscoped objects top samples num strata_n abs absn dflt spl src_state src_events_day src_ws src_we src_updated src_bytes_day src_first_event src_last_event src_last_search src_last_search_user src_stratum_field src_strata_n src_strata src_fields src_used src_alerts src_apps src_mode src_ratio \
| sort 0 n \
| `matalog_window_row`
disabled = 0
enableSched = 0

[matalog agent field summary]
description = Agent surface. One card per source carrying a field name: the field's compact columns, the source essentials as src_* columns and the coverage per stratum with its window; the same keys as the summary endpoint. Token: field_name.
search = | inputlookup matalog_fields | where lower(field_name)=lower("$field_name$") \
| eval win=if(isnotnull(cur_prof_run_id),"profile","discovery"), cov=if(win="profile",cur_prof_coverage,cur_disc_coverage), cnt=if(win="profile",cur_prof_count,cur_disc_count), ev=if(win="profile",cur_prof_events,cur_disc_events), dist=if(win="profile",cur_prof_distinct,cur_disc_distinct), exact=if(win="profile",cur_prof_distinct_exact,null()), ratio=if(win="profile",coalesce(cur_prof_sample_ratio,1),1), run=if(win="profile",cur_prof_run_id,cur_disc_run_id) \
| `matalog_row_window` \
| eval strat=if(level="stratum" AND presence="present" AND coalesce(cov,0)>0, stratum_value."=".round(cov,3)."@".coalesce(ev,"")."@".coalesce(ws,"")."-".coalesce(we,""), null()) \
| eventstats values(strat) AS strata by source_key \
| where level="source" \
| lookup matalog_sources source_key OUTPUT state AS src_state daily_events AS src_events_day daily_bytes AS src_bytes_day first_event_time AS src_first_event last_event_time AS src_last_event last_human_search_time AS src_last_search last_human_search_user AS src_last_search_user stratum_field AS src_stratum_field strata_count AS src_strata_n field_count AS src_fields usage_count AS src_used usage_alert_count AS src_alerts config_apps AS src_apps profile_mode AS src_mode sample_ratio AS src_ratio updated_run_id AS src_updated \
| `matalog_source_window` \
| eval src_strata_n=if(src_stratum_field="__all__",0,src_strata_n), absent=if(src_strata_n>0, src_strata_n-coalesce(mvcount(strata),0), 0) \
| eval top=mvzip(mvindex(top_counts,0,9), mvindex(top_values,0,9), " "), samples=if(isnull(top),mvindex(sample_values,0,4),null()), objects=mvindex(usage_objects,0,4), num=if(numeric_count>0,num_min.",".num_max.",".num_mean,null()) \
| eval fname=if(match(field_name,"[^A-Za-z0-9_.:]"),"\"".field_name."\"",field_name), spl="index=".src_index." sourcetype=\"".src_sourcetype."\" ".fname."=* | stats count by ".fname \
| rename field_name AS n, src_index AS idx, src_sourcetype AS st, field_key AS key, type_guess AS tg, identifier AS id, best_type_rate AS tr, last_seen_time AS seen, first_seen_run AS first_run, origin AS org, origin_app AS app, origin_stanza AS stanza, origin_conflict AS conflict, cim_fields AS dm, meaning_human AS mean, meaning_human_author AS mean_by, meaning_human_time AS mean_at, usage_count AS used, usage_alert_count AS alerts, usage_unscoped_count AS unscoped, rollup_strata AS strata_n, absent_strata AS abs, absent_strata_count AS absn, is_default AS dflt \
| eval ty=replace(best_type_id, "^(mt|user):", ""), kind="field" \
| fillnull value=0 used alerts unscoped conflict id strata_n absn dflt absent \
| table kind n idx st key cov cnt ev dist exact win ratio run ws we no_events anchor tg id ty tr seen first_run org app stanza conflict dm mean mean_by mean_at used alerts unscoped objects top samples num strata_n abs absn dflt presence strata absent spl src_state src_events_day src_ws src_we src_updated src_bytes_day src_first_event src_last_event src_last_search src_last_search_user src_stratum_field src_strata_n src_fields src_used src_alerts src_apps src_mode src_ratio \
| sort 0 - alerts - used - cov - src_events_day idx st \
| `matalog_window_row`
disabled = 0
enableSched = 0

[matalog agent type summary]
description = Agent surface. One card per source-level field whose best semantic type has a bare name (sha256, ipv4, email, a user type), case-insensitive; the same columns as the field summary. Token: type.
search = | inputlookup matalog_fields \
| eval ty=replace(best_type_id, "^(mt|user):", "") \
| eventstats max(eval(if(level="source" AND lower(ty)=lower("$type$"),1,0))) AS hit by source_key field_name \
| where hit=1 \
| eval win=if(isnotnull(cur_prof_run_id),"profile","discovery"), cov=if(win="profile",cur_prof_coverage,cur_disc_coverage), cnt=if(win="profile",cur_prof_count,cur_disc_count), ev=if(win="profile",cur_prof_events,cur_disc_events), dist=if(win="profile",cur_prof_distinct,cur_disc_distinct), exact=if(win="profile",cur_prof_distinct_exact,null()), ratio=if(win="profile",coalesce(cur_prof_sample_ratio,1),1), run=if(win="profile",cur_prof_run_id,cur_disc_run_id) \
| `matalog_row_window` \
| eval strat=if(level="stratum" AND presence="present" AND coalesce(cov,0)>0, stratum_value."=".round(cov,3)."@".coalesce(ev,"")."@".coalesce(ws,"")."-".coalesce(we,""), null()) \
| eventstats values(strat) AS strata by source_key field_name \
| where level="source" \
| lookup matalog_sources source_key OUTPUT state AS src_state daily_events AS src_events_day daily_bytes AS src_bytes_day first_event_time AS src_first_event last_event_time AS src_last_event last_human_search_time AS src_last_search last_human_search_user AS src_last_search_user stratum_field AS src_stratum_field strata_count AS src_strata_n field_count AS src_fields usage_count AS src_used usage_alert_count AS src_alerts config_apps AS src_apps profile_mode AS src_mode sample_ratio AS src_ratio updated_run_id AS src_updated \
| `matalog_source_window` \
| eval src_strata_n=if(src_stratum_field="__all__",0,src_strata_n), absent=if(src_strata_n>0, src_strata_n-coalesce(mvcount(strata),0), 0) \
| eval top=mvzip(mvindex(top_counts,0,9), mvindex(top_values,0,9), " "), samples=if(isnull(top),mvindex(sample_values,0,4),null()), objects=mvindex(usage_objects,0,4), num=if(numeric_count>0,num_min.",".num_max.",".num_mean,null()) \
| eval fname=if(match(field_name,"[^A-Za-z0-9_.:]"),"\"".field_name."\"",field_name), spl="index=".src_index." sourcetype=\"".src_sourcetype."\" ".fname."=* | stats count by ".fname \
| rename field_name AS n, src_index AS idx, src_sourcetype AS st, field_key AS key, type_guess AS tg, identifier AS id, best_type_rate AS tr, last_seen_time AS seen, first_seen_run AS first_run, origin AS org, origin_app AS app, origin_stanza AS stanza, origin_conflict AS conflict, cim_fields AS dm, meaning_human AS mean, meaning_human_author AS mean_by, meaning_human_time AS mean_at, usage_count AS used, usage_alert_count AS alerts, usage_unscoped_count AS unscoped, rollup_strata AS strata_n, absent_strata AS abs, absent_strata_count AS absn, is_default AS dflt \
| eval ty=replace(best_type_id, "^(mt|user):", ""), kind="field" \
| fillnull value=0 used alerts unscoped conflict id strata_n absn dflt absent \
| table kind n idx st key cov cnt ev dist exact win ratio run ws we no_events anchor tg id ty tr seen first_run org app stanza conflict dm mean mean_by mean_at used alerts unscoped objects top samples num strata_n abs absn dflt presence strata absent spl src_state src_events_day src_ws src_we src_updated src_bytes_day src_first_event src_last_event src_last_search src_last_search_user src_stratum_field src_strata_n src_fields src_used src_alerts src_apps src_mode src_ratio \
| sort 0 - alerts - used - cov - src_events_day idx st \
| `matalog_window_row`
disabled = 0
enableSched = 0

[matalog agent name matches]
description = Agent surface. Sources whose sourcetype, search sourcetype, source paths or config app names contain a word (kind=source, exact sourcetype, prefix, substring, source, app) first, then source-level fields whose name contains it (kind=field, exact, prefix, substring, then usage and coverage), case-insensitive; the same keys as the summary endpoint's q route. Token: q.
search = | inputlookup matalog_fields where level="source" \
| eval qlow=lower("$q$"), nlow=lower(field_name) \
| where like(nlow, "%".qlow."%") \
| eval rank=10+case(nlow=qlow, 0, like(nlow, qlow."%"), 1, true(), 2), kind="field" \
| eval win=if(isnotnull(cur_prof_run_id),"profile","discovery"), cov=if(win="profile",cur_prof_coverage,cur_disc_coverage), dist=if(win="profile",cur_prof_distinct,cur_disc_distinct), ev=if(win="profile",cur_prof_events,cur_disc_events), run=if(win="profile",cur_prof_run_id,cur_disc_run_id) \
| eval ty=replace(best_type_id, "^(mt|user):", "") \
| rename field_name AS n, src_index AS idx, src_sourcetype AS st, field_key AS key, last_seen_time AS seen, origin AS org, usage_count AS used, usage_alert_count AS alerts, is_default AS dflt \
| fillnull value=0 used alerts dflt \
| append [| inputlookup matalog_sources \
    | eval qlow=lower("$q$"), stlow=lower(src_sourcetype), sstlow=lower(coalesce(search_sourcetype,src_sourcetype)), srcs_text=lower(mvjoin(sources_top,"\n")), apps_text=lower(replace(mvjoin(config_apps," "),"@[^ ]*","")) \
    | eval via=mvappend(if(like(stlow,"%".qlow."%"),"sourcetype",null()), if(sstlow!=stlow AND like(sstlow,"%".qlow."%"),"search_sourcetype",null()), if(like(srcs_text,"%".qlow."%"),"source",null()), if(like(apps_text,"%".qlow."%"),"app",null())) \
    | where isnotnull(via) \
    | eval rank=case(stlow=qlow OR sstlow=qlow, 0, like(stlow,qlow."%") OR like(sstlow,qlow."%"), 1, like(stlow,"%".qlow."%") OR like(sstlow,"%".qlow."%"), 2, like(srcs_text,"%".qlow."%"), 3, true(), 4), kind="source", win="day", run=updated_run_id \
    | eval spl="index=".src_index." sourcetype=\"".src_sourcetype."\"", page="/app/matalog/source?source_key=".source_key \
    | rename src_index AS idx, src_sourcetype AS st, search_sourcetype AS sst, source_key AS key, daily_events AS events_day, field_count AS fields, usage_count AS used, usage_alert_count AS alerts, last_human_search_time AS last_search, last_human_search_user AS last_search_user, config_apps AS apps \
    | fillnull value=0 used alerts events_day fields] \
| `matalog_row_window` \
| sort 0 rank - used - cov - events_day n idx st \
| table kind n idx st sst key ty cov dist ev win run ws we no_events seen org used alerts dflt state events_day fields last_search last_search_user apps via spl page \
| `matalog_window_row`
disabled = 0
enableSched = 0
