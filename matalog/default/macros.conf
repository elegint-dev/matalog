# The run comment every profiler search carries; the same definition the search app ships, made visible in this app.
[comment(1)]
args = text
definition = ""
iseval = 1

# Window bounds for the agent surface searches, computed from the run records the way the summary endpoint and the
# pages compute them: a window ends budget.window_lag_seconds before the run's slot start and reaches back the
# profile, discovery or cycle length, or a day.

# ws and we of a row carrying run (a run id) and win (profile, discovery or day). A discovery row takes the window
# its stratum row records for that run (cur_earliest, cur_latest, by stratum_key; for a source-level row the span of
# the source's stratum rows discovered in that run), which is the real window of an anchored first discovery; the
# run's discovery window is the fallback. anchor is the discovery's window_anchor (the row's, else the stratum
# row's) and no_events is 1 when a field row's ev is 0; both are empty on a day row.
[matalog_row_window]
definition = join type=left run [| inputlookup matalog_runs | rename run_id AS run, budget.budget.window_lag_seconds AS lag, budget.profile.profile_window_seconds AS plen, budget.discovery.discovery_window_seconds AS dlen | fields run lag plen dlen] | eval we=round(strptime(run."+0000","%Y%m%dT%H%MZ%z")-lag,0), ws=round(we-case(win="profile",plen,win="discovery",dlen,true(),86400),0) | join type=left stratum_key [| inputlookup matalog_strata | rename cur_run_id AS own_run, cur_earliest AS own_ws, cur_latest AS own_we, window_anchor AS own_anchor | fields stratum_key own_run own_ws own_we own_anchor] | join type=left source_key run [| inputlookup matalog_strata where level="stratum" | rename cur_run_id AS run | stats min(cur_earliest) AS span_ws max(cur_latest) AS span_we values(window_anchor) AS span_anchor by source_key run] | eval ws=case(win!="discovery", ws, own_run=run AND isnotnull(own_ws), own_ws, isnotnull(span_ws), span_ws, true(), ws), we=case(win!="discovery", we, own_run=run AND isnotnull(own_we), own_we, isnotnull(span_we), span_we, true(), we), anchor=case(win!="discovery", "", isnotnull(window_anchor) AND window_anchor!="", window_anchor, own_run=run AND isnotnull(own_anchor), own_anchor, isnotnull(span_anchor), mvindex(span_anchor,0), true(), ""), no_events=if(win="day", null(), if(coalesce(ev,0)=0,1,0)) | fields - lag plen dlen own_run own_ws own_we own_anchor span_ws span_we span_anchor

# src_ws and src_we, the trailing day of a row carrying src_updated (the run that last wrote the source row).
[matalog_source_window]
definition = join type=left src_updated [| inputlookup matalog_runs | rename run_id AS src_updated, budget.budget.window_lag_seconds AS src_lag | fields src_updated src_lag] | eval src_we=round(strptime(src_updated."+0000","%Y%m%dT%H%MZ%z")-src_lag,0), src_ws=src_we-86400 | fields - src_lag

# On an empty answer, one kind=window row: the newest committed run's day (ws, we, with ev events over srcs active
# sources), profile (pws, pwe), discovery (dws, dwe) and cycle (cws, cwe) windows.
[matalog_window_row]
definition = appendpipe [| stats count | where count=0 | eval kind="window" | join type=inner kind [| inputlookup matalog_runs where committed=1 | sort 0 - started_at | head 1 | rename run_id AS run, budget.budget.window_lag_seconds AS lag, budget.profile.profile_window_seconds AS plen, budget.discovery.discovery_window_seconds AS dlen, budget.budget.cycle_seconds AS clen | eval kind="window", we=round(strptime(run."+0000","%Y%m%dT%H%MZ%z")-lag,0), ws=we-86400, pws=we-plen, pwe=we, dws=we-dlen, dwe=we, cws=we-clen, cwe=we | join type=left kind [| inputlookup matalog_sources where state="active" | stats sum(daily_events) AS ev count AS srcs | eval kind="window"] | fields kind run ws we ev srcs pws pwe dws dwe cws cwe] | fields - count]
