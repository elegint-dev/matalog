# Splunk Web proxies a splunkd endpoint to the browser only when a stanza here exposes it; the pages reach these
# through /splunkd/__raw as the logged-in user.

[expose:matalog_catalog]
pattern = matalog/catalog
methods = GET,POST

[expose:matalog_summary]
pattern = matalog/summary
methods = GET

[expose:matalog_meanings]
pattern = matalog/meanings
methods = GET,POST
