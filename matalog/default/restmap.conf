# The app's endpoints: /services/matalog/catalog (the pages' reads and the human layer's writes),
# /services/matalog/summary (the agent surface) and /services/matalog/meanings (export and import).
# Each handler receives the system session (passSystemAuth) and the caller's session; it checks the caller's
# capability, reads the collections with the system session and narrows the rows to the indexes the caller's
# roles can search (bin/matalog_access.py). The POST capabilities of the catalog endpoint depend on the
# collection written, so the handler checks them itself.

[script:matalog_catalog]
match = /matalog/catalog
script = matalog_catalog.py
scripttype = persist
handler = matalog_catalog.CatalogHandler
requireAuthentication = true
output_modes = json
passSession = true
passSystemAuth = true
passPayload = true
passHttpHeaders = true
capability.get = matalog_catalog_read
python.version = python3
python.required = 3.13

[script:matalog_summary]
match = /matalog/summary
script = matalog_summary.py
scripttype = persist
handler = matalog_summary.SummaryHandler
requireAuthentication = true
output_modes = json
passSession = true
passSystemAuth = true
capability.get = matalog_summary_read
python.version = python3
python.required = 3.13

[script:matalog_meanings]
match = /matalog/meanings
script = matalog_meanings.py
scripttype = persist
handler = matalog_meanings.MeaningsHandler
requireAuthentication = true
output_modes = json
passSession = true
passSystemAuth = true
passPayload = true
passHttpHeaders = true
capability.get = matalog_summary_read
capability.post = matalog_meanings_write
python.version = python3
python.required = 3.13
