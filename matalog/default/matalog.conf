# matalog settings, every value at its default; override in local/matalog.conf.

[budget]
cycle_seconds = 3600
max_searches_per_cycle = 1500
max_concurrent_searches = 4
max_events_scanned_per_cycle = 100000000
max_search_seconds_per_cycle = 7200
max_wall_seconds_per_cycle = 2700
search_timeout_seconds = 120
max_staleness_cycles = 24
priority_usage_weight = 1.0
window_lag_seconds = 300
index_scan_interval_seconds = 86400

[discovery]
discovery_window_seconds = 900
discovery_head_events = 2000
max_strata_per_source = 300
stratum_list_window_seconds = 86400
stratum_list_sample_ratio = 100
stratum_list_interval_seconds = 86400
max_fields_per_stratum = 500
min_events_for_absence = 200

[profile]
profile_interval_seconds = 86400
profile_window_seconds = 86400
sample_volume_threshold = 1000000
sample_ratio = 100
profile_head_events = 100000
top_values = 10
sample_values = 100
sample_values_max_bytes = 6144
max_value_chars = 128
max_row_bytes = 8192
identifier_distinct = 1000
identifier_distinct_ratio = 0.9
identifier_min_count = 50
identifier_distinct_cap_min = 500
week_baseline_days = 7
store_sample_values = true

[classify]
edge_store_floor = 0.5
max_types_per_field = 3
default_match_threshold = 0.9
default_min_distinct = 2
max_lookup_values = 10000

[usage]
usage_interval_seconds = 86400
audit_initial_lookback_days = 30
max_objects = 20000
usage_objects_shown = 10
service_account = svc_matalog
exclude_users = svc_matalog,splunk-system-user
exclude_apps = matalog

[write]
write_batch_rows = 4000
write_batch_bytes = 1048576
write_reserve_min = 10
kv_batch_size = 500

[rebuild]
rebuild_max_rows = 5000000

[retention]
profiles_frozen_days = 180
run_retention_count = 2000
unobserved_field_days = 30
stratum_retire_days = 30
meaning_revisions = 20
object_stale_runs = 3
cim_stale_runs = 3
gone_after_days = 30

# Stratum seeds: one stanza per sourcetype whose schema is a function of one field.

[stratum:crowdstrike:events:sensor]
stratum_field = event_simpleName
version_field = ConfigBuild
index_pattern = *

[stratum:aws:cloudtrail]
stratum_field = eventName
version_field = eventVersion
index_pattern = *

[stratum:OktaIM2:log]
stratum_field = eventType
version_field = 
index_pattern = *

[stratum:gws:reports:drive]
stratum_field = type
version_field = 
index_pattern = *

[stratum:gws:reports:login]
stratum_field = event.name
version_field = 
index_pattern = *

[stratum:gws:reports:admin]
stratum_field = event.name
version_field = 
index_pattern = *

[stratum:XmlWinEventLog]
stratum_field = EventCode
version_field = 
index_pattern = *

[stratum:WinEventLog]
stratum_field = EventCode
