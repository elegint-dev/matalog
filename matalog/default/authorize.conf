# Roles and capabilities of the catalog. Readers reach the collections through /services/matalog/catalog and
# /services/matalog/summary, filtered to the indexes their roles can search; writers add the human layer through
# the same handlers. The built-in roles and the profiler's role get the capabilities directly: an importRoles line
# in this file would replace, not extend, the import list those roles already carry.

[capability::matalog_summary_read]

[capability::matalog_catalog_read]

[capability::matalog_meanings_write]

[capability::matalog_types_write]

[role_matalog_reader]
matalog_summary_read = enabled
matalog_catalog_read = enabled
# Splunk Web reads the app's properties to render a page; a role with nothing else still needs this to open the pages.
rest_properties_get = enabled

[role_matalog_writer]
importRoles = matalog_reader
matalog_meanings_write = enabled
matalog_types_write = enabled

[role_admin]
matalog_summary_read = enabled
matalog_catalog_read = enabled
matalog_meanings_write = enabled
matalog_types_write = enabled

[role_sc_admin]
matalog_summary_read = enabled
matalog_catalog_read = enabled
matalog_meanings_write = enabled
matalog_types_write = enabled

[role_matalog_profiler]
matalog_summary_read = enabled
matalog_catalog_read = enabled
matalog_meanings_write = enabled
matalog_types_write = enabled
