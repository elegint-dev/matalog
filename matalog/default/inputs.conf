# The profiler. Enable in local/inputs.conf after the service account exists; interval is a cron at the slot start.
# python.required picks the interpreter; python.version names the same Python 3.
[matalog_profiler]
python.version = python3
python.required = 3.13

[matalog_profiler://default]
python.version = python3
python.required = 3.13
run_mode = normal
interval = 0 * * * *
disabled = 1
